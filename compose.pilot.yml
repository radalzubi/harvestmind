services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      LOG_LEVEL: WARNING
      HARVESTMIND_ENV: pilot
      HARVESTMIND_BIND_HOST: 0.0.0.0
      HARVESTMIND_AUTH_REQUIRED: "true"
      HARVESTMIND_ADMIN_KEY: ${HARVESTMIND_ADMIN_KEY:?set HARVESTMIND_ADMIN_KEY}
      HARVESTMIND_RATE_LIMIT_PER_MIN: "30"
      HARVESTMIND_DATA_ROOT: /var/lib/harvestmind
      DUCKDB_PATH: /var/lib/harvestmind/root.duckdb
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      USE_REAL_LLM: "false"
    volumes:
      - harvestmind-data:/var/lib/harvestmind
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  harvestmind-data:

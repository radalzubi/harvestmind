# gitleaks configuration for the canonical ZAAD repository (CI job "secret scan").
# Default rules apply. One documented, scoped allowlist; never a blanket ignore.
title = "zaad"

[extend]
useDefault = true

[allowlist]
description = """Historical false positive: a pip-audit report committed at 5895f184 (removed at 3c03787)
contained an objects.githubusercontent.com presigned download URL whose X-Amz-Credential carries
GitHub's public S3 access key id AKIAIWNJYAX4CSVEH53A (a five-minute presigned link from 2023-06-27,
not a repository credential). The file is no longer tracked; history is not rewritten."""
regexTarget = "match"
regexes = ['''AKIAIWNJYAX4CSVEH53A''']
paths = ['''^artifacts/baseline/pip_audit\.json$''']

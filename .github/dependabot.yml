version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      security-and-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/web"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: monthly}

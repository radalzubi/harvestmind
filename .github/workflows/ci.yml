name: CI

# Canonical ZAAD gates (post-P1 integration). Every job blocks; the only tolerated debt is listed
# explicitly (ruff: docs/, dashboard/ and the P1 diagnostic scripts under scripts/p1_*.py are
# excluded from the blocking scope and reported by the non-blocking step).
#
# Security note: ref names reach `run:` blocks only through `env:` with quoted expansion, never by
# `${{ }}` interpolation into the shell. Git ref names are attacker-controllable on a fork PR, and
# direct interpolation is the standard GitHub Actions script-injection vector.

# Post-P4B cleanup (2026-09-13): one workflow, one trigger set. Markdown-only changes do not run the
# optimizer suite (no Python, workflow, Docker or evidence-record file reads a .md file); every other
# path, including the evidence JSON / JSONL the frozen regression compares against, runs every gate.
# `zaad/canonical` (the closed release line, merged) is no longer a push target.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    # The full suite runs 6 minutes locally (12 cores) and 20-45x slower per shard on this 2-vCPU
    # runner. Post-P4B cleanup: the ZAAD unit files are split into four name ranges balanced on
    # measured per-file durations (local seconds 53 / 66 / 76 / 43; the previous [a-m] / [n-r] / [s-z]
    # split weighed 75 / 43 / 119 and its heaviest shard took 45 minutes). Coverage collection was
    # removed: it was uploaded and never read by any gate, and it slowed the solver-heavy tests by
    # 40 % or more. Every test still runs exactly once (the partition check below fails the job if a
    # test_zaad_*.py file is in no shard or in two); no timeout is widened; no optimizer change.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: integration
            paths: tests/integration
          - shard: security
            paths: tests/security
          - shard: unit-core
            paths: tests/unit --ignore-glob='tests/unit/test_zaad_*.py'
          - shard: unit-zaad-1
            paths: tests/unit/test_zaad_[a-e]*.py
          - shard: unit-zaad-2
            paths: tests/unit/test_zaad_[f-r]*.py
          - shard: unit-zaad-3
            paths: tests/unit/test_zaad_se*.py
          - shard: unit-zaad-4
            paths: tests/unit/test_zaad_s[f-z]*.py tests/unit/test_zaad_[t-z]*.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Shard partition check (every test_zaad_*.py file in exactly one shard)
        run: |
          python - <<'PY'
          import glob
          shards = ["tests/unit/test_zaad_[a-e]*.py", "tests/unit/test_zaad_[f-r]*.py", "tests/unit/test_zaad_se*.py",
                    "tests/unit/test_zaad_s[f-z]*.py", "tests/unit/test_zaad_[t-z]*.py"]
          seen = [f for g in shards for f in glob.glob(g)]
          every = sorted(glob.glob("tests/unit/test_zaad_*.py"))
          assert sorted(seen) == every, (sorted(set(every) - set(seen)), sorted(f for f in seen if seen.count(f) > 1))
          print(f"{len(every)} zaad unit files partitioned into {len(shards)} globs")
          PY
      - name: Run tests
        # No network, no API keys, no paid services: every external connector is mocked in the
        # suite, and the solver is bundled. Integration tests run too (the API, jobs, tenant
        # isolation, the canonical workspace path).
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest ${{ matrix.paths }} -q --durations=30

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        # From the project's own [dev] extra, which pins an exact version.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint the canonical scope (blocking)
        # Product, runtime, tests and scripts. Excluded and reported below: docs/ (evidence
        # snippets), dashboard/ (the deprecated HarvestMind Streamlit shell) and the frozen P1
        # diagnostic scripts, whose provenance must not be disturbed.
        run: ruff check . --extend-exclude "docs,dashboard,scripts/p1_*.py"
      - name: Report excluded lint debt (non-blocking)
        if: always()
        continue-on-error: true
        run: ruff check docs dashboard scripts --statistics || true

  types:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type-check the decision core and the product packages (blocking)
        run: python -m mypy optimization risk backtesting api ingestion domain adaptive zaad/full --ignore-missing-imports

  security:
    name: security (bandit, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: bandit (medium severity and above, non-test packages)
        run: python -m bandit -r api infrastructure ingestion optimization risk backtesting reports pool forecasting domain zaad/full -ll -q
      - name: pip-audit (dependency closure)
        # PYSEC-2026-3412 (weasyprint, the PDF report renderer) is ignored on purpose: the
        # affected code path is not reachable from the API; the ignore is reviewed at each
        # release (docs/ZAAD_RELEASE_LEDGER.md, CI debt).
        run: python -m pip_audit --ignore-vuln PYSEC-2026-3412

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # gitleaks-action lists the pull request's commits to scan exactly the range under review;
      # that read needs pull-requests: read (the first PR run failed 403 without it). Still no write.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # findings go to the job summary and the SARIF artifact; PR comments would need write scope
          GITLEAKS_ENABLE_COMMENTS: "false"

  zaad-regression:
    name: zaad frozen regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Frozen P0 / P1 identity (B, T, Q, A short replays against the freeze record; P0 cell 15)
        # A few minutes, no benchmark matrix: integration corruption of the frozen optimizer
        # fails this job. The full A-T matrix is never run in ordinary CI.
        env:
          PYTHONPATH: .
        run: python -m scripts.zaad_canonical_regression
      - name: P1 economics invariants (720 checks)
        env:
          PYTHONPATH: .
        run: |
          python -m scripts.p1_invariants
          python -c "import json; rows = json.load(open('docs/zaad_full/evidence/p1/P1_INVARIANTS.json')); failed = [(r['fixture'], r['seed'], k) for r in rows for k, v in r['checks'].items() if not (v if isinstance(v, bool) else v.get('pass', True))]; assert not failed, failed[:5]; print('invariants clean:', sum(len(r['checks']) for r in rows))"
      - name: Customer-data path smoke (synthetic workspace -> Request -> frozen plan)
        env:
          PYTHONPATH: .
        run: python -m scripts.zaad_workspace_smoke 7 A_stable 3

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zaad-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke the image (import, health, fail-closed posture, single planning engine)
        run: |
          set -euo pipefail
          docker run --rm -e HARVESTMIND_ENV=prod zaad-api:ci python -c "$(cat <<'PY'
          from fastapi.testclient import TestClient
          from api.main import app
          c = TestClient(app)
          h = c.get("/health")
          assert h.status_code == 200 and h.json()["service"] == "zaad-api", h.text
          assert h.json()["auth_enforced"] is True, "production must fail closed"
          assert c.get("/api/zaad/network/jobs").status_code == 401, "no anonymous access in prod"
          assert c.get("/api/zaad/demo").status_code in (401, 410), "legacy planners must not be open in prod"
          print("image smoke ok", h.json())
          PY
          )"
      - name: Validate compose file
        # compose.pilot.yml refuses to interpolate without the admin key; a placeholder is enough to
        # validate the file (it is not a secret and never leaves the runner).
        env:
          POSTGRES_PASSWORD: ci-only
          HARVESTMIND_ADMIN_KEY: ci-placeholder-not-a-secret
        run: docker compose -f compose.pilot.yml config -q

  frontend:
    name: frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Dependency audit (production dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

# Deploy the ZAAD API to Fly from an exact commit, on GitHub's network.
#
# The repository's release convention is "deploy from a clean detached checkout of the merge
# SHA with the canonical image label". This workflow is that convention run from a GitHub
# runner instead of a laptop: it checks out exactly the requested SHA, refuses to continue if
# the checkout is not that SHA, and hands the tree to Fly's builder with the label
# `canonical-<short sha>`. It never chooses a SHA itself and never deploys a branch tip.
name: deploy-api

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The exact commit to deploy (a merge commit on main)"
        required: true
        type: string
      app:
        description: "Fly app"
        required: false
        default: "zaad-api"
        type: string

concurrency:
  group: deploy-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
      - name: The checkout is exactly the requested commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          test -z "$(git status --porcelain)"
          echo "deploying $(git rev-parse HEAD) tree $(git rev-parse HEAD^{tree})"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy with the canonical image label
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short=7 HEAD)"
          flyctl deploy -a "${{ inputs.app }}" --image-label "canonical-${SHORT}" --strategy rolling --yes --remote-only --build-context-warn-size 0
      - name: Record what runs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status -a "${{ inputs.app }}"
          flyctl releases -a "${{ inputs.app }}" | head -5

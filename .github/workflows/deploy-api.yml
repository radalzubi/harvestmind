# Deploy the ZAAD API to Fly from an exact commit, on GitHub's network.
#
# The repository's release convention is "deploy from a clean detached checkout of the merge
# SHA with the canonical image label". This workflow is that convention run from a GitHub
# runner instead of a laptop: it checks out exactly the requested SHA, refuses to continue if
# the checkout is not that SHA, and hands the tree to Fly's builder with the label
# `canonical-<short sha>`. It never chooses a SHA itself and never deploys a branch tip.
name: deploy-api

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The exact commit to deploy (a merge commit on main)"
        required: true
        type: string
      app:
        description: "Fly app"
        required: false
        default: "zaad-api"
        type: string

concurrency:
  group: deploy-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # Inputs reach the shell through the environment, never through `${{ }}` inside `run:` (security review
    # 2026-09, SEC-018); the app name is allowlisted and the commit must be on main.
    env:
      DEPLOY_SHA: ${{ inputs.sha }}
      DEPLOY_APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: The checkout is exactly the requested commit, and the commit is on main
        run: |
          set -euo pipefail
          case "$DEPLOY_APP" in zaad-api) ;; *) echo "refusing: app '$DEPLOY_APP' is not deployable from this workflow"; exit 1;; esac
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main || { echo "refusing: $DEPLOY_SHA is not on main"; exit 1; }
          echo "deploying $(git rev-parse HEAD) tree $(git rev-parse HEAD^{tree})"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # 1.6
      - name: Deploy with the canonical image label
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short=7 HEAD)"
          flyctl deploy -a "$DEPLOY_APP" --image-label "canonical-${SHORT}" --strategy rolling --yes --remote-only --build-context-warn-size 0
      - name: Record what runs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status -a "$DEPLOY_APP"
          flyctl releases -a "$DEPLOY_APP" | head -5

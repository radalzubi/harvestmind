name: publication-security
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect only, or revoke the historically exposed SEC-001 code
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - revoke
          - verify
permissions:
  contents: read
concurrency:
  group: zaad-publication-security
  cancel-in-progress: false
jobs:
  publication-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the isolated remediation
        run: python -m unittest discover -s tests -p test_publication_revocation.py -v
      - name: Inspect or revoke only the historical pilot access code
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if [ "$OPERATION" = revoke ]; then
            python scripts/revoke_exposed_pilot_code.py --apply
          elif [ "$OPERATION" = verify ]; then
            python scripts/revoke_exposed_pilot_code.py --verify-only
          else
            python scripts/revoke_exposed_pilot_code.py
          fi
      - name: Install checksum-verified Gitleaks
        if: always()
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all fetched branch and tag history with redacted output
        if: always()
        run: |
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100 --report-format=json --report-path="$RUNNER_TEMP/gitleaks.json" --exit-code=0
          python - <<'PY'
          import json, os
          from pathlib import Path
          findings = json.loads((Path(os.environ['RUNNER_TEMP']) / 'gitleaks.json').read_text())
          print('SECRET_SCAN_FINDINGS=' + str(len(findings)))
          for finding in findings:
              print(json.dumps({key: finding.get(key) for key in ('RuleID', 'File', 'StartLine', 'Commit', 'Fingerprint')}))
          PY

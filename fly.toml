# Fly.io definition for the HarvestMind API. The web app deploys separately
# (Vercel) and points NEXT_PUBLIC_API_URL at this app's URL.
app = "harvestmind-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  HARVESTMIND_ENV = "pilot"
  HARVESTMIND_BIND_HOST = "0.0.0.0"
  HARVESTMIND_DATA_ROOT = "/var/lib/harvestmind"
  DUCKDB_PATH = "/var/lib/harvestmind/root.duckdb"
  HARVESTMIND_SOLVER_THREADS = "2"

[[mounts]]
  source = "harvestmind_data"
  destination = "/var/lib/harvestmind"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

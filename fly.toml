# fly.toml app configuration file generated for zaad-api on 2026-09-05T14:42:07-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zaad-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  DUCKDB_PATH = '/var/lib/harvestmind/root.duckdb'
  HARVESTMIND_BIND_HOST = '::'
  HARVESTMIND_DATA_ROOT = '/var/lib/harvestmind'
  HARVESTMIND_ENV = 'pilot'
  HARVESTMIND_SOLVER_THREADS = '1'
  HARVESTMIND_GATE_SCENARIOS = '20'
  HARVESTMIND_WORKER_CPUS = '4'
  HARVESTMIND_WORKER_MEMORY_MB = '8192'
  # P5 ATP / scarce-supply allocation (release audit): the promising paths exist in this environment;
  # every request must still declare an enabled `atp` block, is authenticated, bounded, and approval-only.
  ZAAD_ATP_ENABLED = '1'
  HARVESTMIND_GATE_WORKERS = '4'

[[mounts]]
  source = 'harvestmind_data'
  destination = '/var/lib/harvestmind'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvestmind"
version = "0.1.0"
description = "Stochastic supply planning for Midwest fresh produce distributors and food hubs"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "HarvestMind Team", email = "team@harvestmind.io" }]

dependencies = [
    "pyomo>=6.7",
    "highspy>=1.7",
    "mlforecast>=0.13",
    "lightgbm>=4.3",
    "hierarchicalforecast>=0.4",
    "pandas>=2.2",
    "polars>=0.20",
    "duckdb>=0.10",
    "sqlalchemy>=2.0",
    "pandera>=0.18",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.33",
    "plotly>=5.20",
    "jinja2>=3.1",
    "weasyprint>=60",
    "boto3>=1.34",
    "paramiko>=3.4",
    "requests>=2.33",  # 2.33+ resolves CVE-2026-25645
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.3",
]

[project.scripts]
harvestmind-demo = "scripts.demo_run:main"
harvestmind-backtest = "scripts.run_backtest:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = false
log_cli_level = "INFO"
# Disable the auto-loaded `fugue_test` pytest plugin: it ships with `fugue`
# (a transitive dep of statsforecast) and crashes pytest_configure on
# Python 3.14 because its own dependency `adagio` is missing on PyPI for 3.14.
# We don't use fugue or its pytest fixtures, so the safest fix is to never
# load the plugin.
addopts = "-p no:fugue_test"
